[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-credit"
version = "0.1.0"
description = "Ghost Credit: fake bank alert detection for Nigerian shops"
requires-python = ">=3.10"
dependencies = [
    "Pillow",
    "imagehash",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "hypothesis>=6",
]

aws = ["boto3"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
